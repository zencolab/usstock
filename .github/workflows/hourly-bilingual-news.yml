name: Hourly bilingual US stock news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_GATEWAY_URL: https://script.google.com/macros/s/AKfycbx3JuXMbJOAiiHhUUl3MIQrM2LYlZgCQhkiCNajewFpJxTiRl5cFMXjq45Z_gBqYvHB/exec

concurrency:
  group: hourly-bilingual-news
  cancel-in-progress: false

jobs:
  collect-translate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hourly_news_bot
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      DRIVE_GATEWAY_TOKEN: ${{ secrets.AGENT_UPLOAD_TOKEN || secrets.DRIVE_GATEWAY_TOKEN }}
      REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
      MAX_ITEMS_PER_SOURCE: ${{ vars.MAX_ITEMS_PER_SOURCE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hourly_news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$OLLAMA_API_KEY" || { echo "Missing OLLAMA_API_KEY"; exit 1; }
          test -n "$DRIVE_GATEWAY_TOKEN" || { echo "Missing AGENT_UPLOAD_TOKEN or DRIVE_GATEWAY_TOKEN"; exit 1; }

      - name: Restore dedupe state
        uses: actions/cache/restore@v4
        with:
          path: hourly_news_bot/state
          key: hourly-news-state-${{ github.run_id }}
          restore-keys: |
            hourly-news-state-

      - name: Collect, translate and upload
        run: python -m src.main

      - name: Save dedupe state
        if: always() && hashFiles('hourly_news_bot/state/crawler-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: hourly_news_bot/state
          key: hourly-news-state-${{ github.run_id }}

      - name: Keep generated Markdown, JSON and HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-news-${{ github.run_id }}
          path: hourly_news_bot/output/
          if-no-files-found: ignore
          retention-days: 7
