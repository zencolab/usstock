name: Review bootstrap (offline verification)

on:
  push:
    branches: [fix/report-regressions-20260908]
    paths:
      - .github/workflows/review-bootstrap.yml
      - maintenance/RUN-VERIFICATION.md

permissions:
  contents: write

concurrency:
  group: review-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r hourly_news_bot/requirements.txt
      - name: Install Chinese fonts and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
          fc-cache -f >/dev/null
      - name: Baseline, red phase, guarded fixes, final proof
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-results
          python maintenance/verify_and_prepare.py 2>&1 | tee .test-results/bootstrap.log
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification-${{ github.run_id }}
          path: .test-results
          retention-days: 30
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet .github/workflows/review-bootstrap.yml maintenance
          git add -u
          git add .github/workflows/offline-ci.yml \
            scripts/run_offline_tests.py \
            scripts/smoke_offline_reports.py \
            tests/test_review_regressions.py \
            russell2000_market_report/tests/test_review_regressions.py \
            hourly_news_bot/tests/test_review_regressions.py \
            docs
          git commit -m "Fix report escaping, historical cutoffs, delivery state and feed defaults"
          git push origin HEAD:${{ github.ref_name }}
      - name: Publish diagnostics on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="maintenance/logs/run-${{ github.run_id }}"
          mkdir -p "$target"
          cp -f .test-results/*.json "$target"/ 2>/dev/null || true
          cp -f .test-results/*.log "$target"/ 2>/dev/null || true
          if [[ -f .test-results/smoke/summary.json ]]; then
            cp -f .test-results/smoke/summary.json "$target"/smoke-summary.json
          fi
          git checkout -- . 2>/dev/null || true
          git add -f "$target"
          git commit -m "Add offline verification diagnostics for run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
