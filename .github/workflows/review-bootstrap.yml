name: Verify and commit reviewed fixes

on:
  push:
    branches: [fix/report-regressions-20260908]
    paths:
      - maintenance/review_bundle.b64

permissions:
  contents: write

concurrency:
  group: review-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/fix/report-regressions-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-regressions-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack the checksum-verified review source bundle
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path('maintenance/review_bundle.b64').read_text().split())
          data = base64.b64decode(encoded, validate=True)
          expected = 'f4998dc10801c78ba7c07a6187af9fdefc46d9f80d431bb27cd5861fc4d4b6b4'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Review source bundle checksum mismatch')
          files = json.loads(lzma.decompress(data))
          allowed = {'.github/workflows/offline-ci.yml', 'maintenance/apply_review_fixes.py', 'maintenance/cases/news.py', 'maintenance/cases/root.py', 'maintenance/cases/russell.py', 'maintenance/verify_and_prepare.py', 'scripts/run_offline_tests.py', 'scripts/smoke_offline_reports.py'}
          if set(files) != allowed:
              raise SystemExit('Unexpected source bundle paths')
          for name, content in files.items():
              path = Path(name)
              if path.exists() or PurePosixPath(name).is_absolute() or '..' in PurePosixPath(name).parts:
                  raise SystemExit('Refusing to overwrite existing or unsafe path: ' + name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          PY
      - name: Install declared test dependencies and PDF fonts
        run: |
          pip install -r requirements.txt -r hourly_news_bot/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
          fc-cache -f >/dev/null
      - name: Verify baseline, reproduce regressions, apply fixes and verify again
        run: python maintenance/verify_and_prepare.py
      - name: Commit only verified fixes to the dedicated branch
        run: |
          git rm .github/workflows/review-bootstrap.yml maintenance/review_bundle.b64
          rm -rf maintenance
          git add -u
          git add .github/workflows/offline-ci.yml scripts/run_offline_tests.py scripts/smoke_offline_reports.py
          git add tests/test_review_regressions.py hourly_news_bot/tests/test_review_regressions.py russell2000_market_report/tests/test_review_regressions.py
          git add docs/verification-2026-09-08.md docs/verification-2026-09-08.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix report safety, historical cutoffs, delivery state and defaults'
          git push origin HEAD:fix/report-regressions-20260908
      - name: Keep verification logs and generated demo PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-verification-${{ github.run_id }}
          path: .test-results/
          if-no-files-found: ignore
          retention-days: 14
