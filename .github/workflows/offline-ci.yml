name: Offline tests

on:
  push:
    branches-ignore: [gh-pages]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r hourly_news_bot/requirements.txt
      - name: Install Chinese fonts and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
          fc-cache -f >/dev/null
      - name: Unit tests (offline, no live APIs)
        run: python scripts/run_offline_tests.py
      - name: Demo smoke test (offline, no uploads or Pages)
        run: python scripts/smoke_offline_reports.py
      - name: Upload offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ci-${{ github.run_id }}
          path: .test-results
          retention-days: 14
