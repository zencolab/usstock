name: Offline tests

# Verification only. This workflow never touches production data:
# no market-data API keys, no Ollama, no Drive upload, no Pages publish.

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f hourly_news_bot/requirements.txt ]; then
            pip install -r hourly_news_bot/requirements.txt
          fi

      - name: Byte-compile the review fix modules
        run: |
          python -m py_compile \
            template_env.py \
            runtime_config.py \
            report_asof.py \
            russell2000_market_report/universe_snapshot.py \
            hourly_news_bot/src/state.py \
            scripts/run_offline_tests.py \
            scripts/assert_escaped_output.py

      - name: Byte-compile the existing pipeline modules
        run: |
          python -m py_compile \
            market_report.py \
            hybrid_data.py \
            hybrid_runtime.py \
            bilingual_runtime.py \
            news_translation.py \
            premium_translation.py \
            ai_translation.py \
            russell2000_market_report/universe.py \
            russell2000_market_report/runtime.py \
            hourly_news_bot/src/main.py \
            scripts/validate_output.py \
            scripts/render_market_report_pdf.py

      - name: Run the code-review regression tests
        run: python scripts/run_offline_tests.py --regressions

      - name: Run every offline test suite
        run: python scripts/run_offline_tests.py

      - name: Offline demo report smoke test
        id: demo
        continue-on-error: true
        run: |
          python market_report.py --mode demo --top-n 2 \
            --output site-smoke --data-output output-smoke

      - name: Scan the demo output for unsafe link schemes
        if: steps.demo.outcome == 'success'
        run: python scripts/assert_escaped_output.py site-smoke

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-smoke-${{ github.run_id }}
          path: |
            site-smoke
            output-smoke
          retention-days: 7
          if-no-files-found: ignore
