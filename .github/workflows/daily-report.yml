name: US market close report

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trading date (YYYY-MM-DD); blank = latest completed session"
        required: false
        type: string
      mode:
        description: "Data mode"
        required: true
        default: "live"
        type: choice
        options: [live, demo]
      top_n:
        description: "Number of gainers and losers"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

concurrency:
  group: market-close-report
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg-data

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile, test, and run offline smoke test
        run: |
          python -m py_compile market_report.py hybrid_data.py hybrid_runtime.py bilingual_runtime.py news_translation.py premium_translation.py ai_translation.py scripts/validate_output.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python market_report.py --mode demo --date 2026-08-10 --top-n 2 --output site-smoke --data-output output-smoke
          python scripts/validate_output.py site-smoke --expected-min 2 --expected-mode demo
          rm -rf site-smoke output-smoke
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: market-cache-${{ runner.os }}-
      - name: Generate report
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_RPM: ${{ secrets.MASSIVE_RPM || '5' }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
          ALPACA_NEWS_RPM: ${{ vars.ALPACA_NEWS_RPM || '180' }}
          ALPACA_NEWS_MAX_PAGES: ${{ vars.ALPACA_NEWS_MAX_PAGES || '100' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RPS: ${{ vars.SEC_RPS || '5' }}
          TRANSLATION_PROVIDER: ollama
          OLLAMA_BASE_URL: https://ollama.com/api
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_API_KEY_FALLBACK: ${{ secrets.OLLAMA_API_KEY_FALLBACK }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:cloud' }}
          OLLAMA_RPM: ${{ vars.OLLAMA_RPM || '20' }}
        shell: bash
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}"
          TOP_N="${{ github.event_name == 'workflow_dispatch' && inputs.top_n || '100' }}"
          TRADE_DATE="${{ github.event_name == 'workflow_dispatch' && inputs.trade_date || '' }}"
          if [[ "$MODE" == "live" ]]; then
            missing=()
            [[ -z "${MASSIVE_API_KEY:-}" ]] && missing+=(MASSIVE_API_KEY)
            [[ -z "${ALPACA_API_KEY_ID:-}" ]] && missing+=(ALPACA_API_KEY_ID)
            [[ -z "${ALPACA_API_SECRET_KEY:-}" ]] && missing+=(ALPACA_API_SECRET_KEY)
            [[ -z "${SEC_USER_AGENT:-}" ]] && missing+=(SEC_USER_AGENT)
            [[ -z "${OLLAMA_API_KEY:-}" ]] && missing+=(OLLAMA_API_KEY)
            if (( ${#missing[@]} > 0 )); then
              echo "::error::Missing live-mode Repository secrets: ${missing[*]}"
              echo "The previous report is preserved; demo data will not replace it."
              exit 1
            fi
          fi
          DATE_ARG=()
          if [[ -n "$TRADE_DATE" ]]; then DATE_ARG=(--date "$TRADE_DATE"); fi
          set +e
          python market_report.py --mode "$MODE" --top-n "$TOP_N" --output site --data-output output "${DATE_ARG[@]}" 2>&1 | tee /tmp/market-report.log
          REPORT_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$REPORT_STATUS" -ne 0 ]]; then
            python - <<'PY'
          import os
          from pathlib import Path
          text = Path("/tmp/market-report.log").read_text(encoding="utf-8", errors="replace")
          for name in ("MASSIVE_API_KEY", "ALPACA_API_KEY_ID", "ALPACA_API_SECRET_KEY", "SEC_USER_AGENT", "OLLAMA_API_KEY", "OLLAMA_API_KEY_FALLBACK"):
              secret = os.getenv(name, "")
              if secret:
                  text = text.replace(secret, "***")
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          message = " | ".join(lines[-8:])[-3800:] or "Unknown live report error"
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Live report failed::{message}")
          PY
            exit "$REPORT_STATUS"
          fi
          python scripts/validate_output.py site --expected-min "$TOP_N" --expected-mode "$MODE"
      - name: Upload dated data and report
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: |
            site
            output
          retention-days: 90
      - name: Prepare GitHub Pages branch
        run: |
          mkdir -p publish/site
          cp -a site/. publish/site/
          touch publish/.nojekyll publish/site/.nojekyll
          cat > publish/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=site/index.html"><title>美股收盘日报</title><script>location.replace('site/index.html');</script></head><body><p>正在打开<a href="site/index.html">美股收盘日报</a>…</p></body></html>
          HTML
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          force_orphan: true
          enable_jekyll: false
