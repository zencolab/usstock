name: US market close report

on:
  push:
    branches:
      - main
  schedule:
    # Runs after the regular US close and follows daylight-saving time.
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trading date (YYYY-MM-DD); blank = latest completed session"
        required: false
        type: string
      mode:
        description: "Data mode"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - demo
      top_n:
        description: "Number of gainers and losers"
        required: true
        default: "100"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: market-close-report
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-cache-${{ runner.os }}-

      - name: Generate report
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MASSIVE_RPM: ${{ secrets.MASSIVE_RPM || '5' }}
        shell: bash
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}"
          TOP_N="${{ github.event_name == 'workflow_dispatch' && inputs.top_n || '100' }}"
          TRADE_DATE="${{ github.event_name == 'workflow_dispatch' && inputs.trade_date || '' }}"
          if [[ "$MODE" == "live" && -z "${MASSIVE_API_KEY:-}" ]]; then
            echo "::warning::MASSIVE_API_KEY is not configured; deploying demo data until the secret is added."
            MODE="demo"
          fi
          DATE_ARG=()
          if [[ -n "$TRADE_DATE" ]]; then DATE_ARG=(--date "$TRADE_DATE"); fi
          python market_report.py \
            --mode "$MODE" \
            --top-n "$TOP_N" \
            --output site \
            --data-output output \
            "${DATE_ARG[@]}"
          python scripts/validate_output.py site --expected-min "$TOP_N"

      - name: Upload dated data and report
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: |
            site
            output
          retention-days: 90

      - name: Publish generated site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          mkdir -p "$PUBLISH_DIR/.github/workflows"
          cp -a site/. "$PUBLISH_DIR/"
          touch "$PUBLISH_DIR/.nojekyll"
          cp .github/workflows/pages-deploy.yml "$PUBLISH_DIR/.github/workflows/pages-deploy.yml"
          cd "$PUBLISH_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy report from ${GITHUB_SHA}"
          git remote add origin "{{https://github.com/${GITHUB_REPOSITORY}}}.git"
          gh auth setup-git
          git push --force origin gh-pages

      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run pages-deploy.yml --ref gh-pages; then
              exit 0
            fi
            sleep 5
          done
          exit 1
