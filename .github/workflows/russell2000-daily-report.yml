name: Russell 2000 market close report

on:
  schedule:
    - cron: "45 22 * * 1-5"
    - cron: "45 23 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trading date (YYYY-MM-DD); blank = latest completed session"
        required: false
        type: string
      mode:
        description: "Data mode"
        required: true
        default: "live"
        type: choice
        options: [live, demo]
      top_n:
        description: "Number of Russell 2000 gainers and losers"
        required: true
        default: "100"
        type: string

permissions:
  contents: write

concurrency:
  group: usstock-report-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  XDG_DATA_HOME: ${{ github.workspace }}/russell2000_market_report/.cache/xdg-data
  DRIVE_GATEWAY_URL: https://script.google.com/macros/s/AKfycbx3JuXMbJOAiiHhUUl3MIQrM2LYlZgCQhkiCNajewFpJxTiRl5cFMXjq45Z_gBqYvHB/exec
  RUSSELL2000_HOLDINGS_URL: ${{ vars.RUSSELL2000_HOLDINGS_URL }}

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Select the New York 18:45 schedule
        id: check
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NY_OFFSET="$(TZ=America/New_York date +%z)"
          if [[ "$NY_OFFSET" == "-0400" && "$EVENT_SCHEDULE" == "45 22 * * 1-5" ]] ||
             [[ "$NY_OFFSET" == "-0500" && "$EVENT_SCHEDULE" == "45 23 * * 1-5" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping UTC schedule $EVENT_SCHEDULE for New York offset $NY_OFFSET."
          fi

  build-and-publish:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ensure Chinese PDF fonts
        shell: bash
        run: |
          if ! fc-match "Noto Sans CJK SC" | grep -qi "NotoSansCJK"; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f >/dev/null
          fi
      - name: Compile, test, and run offline smoke test
        run: |
          python -m py_compile russell2000_market_report/main.py russell2000_market_report/universe.py russell2000_market_report/runtime.py russell2000_market_report/scripts/validate_output.py
          python -m unittest discover -s russell2000_market_report/tests -p 'test_*.py' -v
          python -m russell2000_market_report.main --mode demo --date 2026-08-10 --top-n 2 --output russell2000_market_report/site-smoke --data-output russell2000_market_report/output-smoke
          python scripts/validate_output.py russell2000_market_report/site-smoke --expected-min 2 --expected-mode demo
          python russell2000_market_report/scripts/validate_output.py russell2000_market_report/site-smoke --expected-mode demo --expected-top-n 2
          python scripts/render_market_report_pdf.py --site russell2000_market_report/site-smoke --output russell2000_market_report/pdf-smoke/summary.pdf
          rm -rf russell2000_market_report/site-smoke russell2000_market_report/output-smoke russell2000_market_report/pdf-smoke
      - name: Restore Russell 2000 cache
        uses: actions/cache@v4
        with:
          path: russell2000_market_report/.cache
          key: russell2000-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: russell2000-cache-${{ runner.os }}-
      - name: Generate Russell 2000 report
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_RPM: ${{ secrets.MASSIVE_RPM || '5' }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
          ALPACA_NEWS_RPM: ${{ vars.ALPACA_NEWS_RPM || '180' }}
          ALPACA_NEWS_MAX_PAGES: ${{ vars.ALPACA_NEWS_MAX_PAGES || '100' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RPS: ${{ vars.SEC_RPS || '5' }}
          TRANSLATION_PROVIDER: ollama
          OLLAMA_BASE_URL: https://ollama.com/api
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_API_KEY_FALLBACK: ${{ secrets.OLLAMA_API_KEY_FALLBACK }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:cloud' }}
          OLLAMA_RPM: ${{ vars.OLLAMA_RPM || '20' }}
        shell: bash
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}"
          TOP_N="${{ github.event_name == 'workflow_dispatch' && inputs.top_n || '100' }}"
          TRADE_DATE="${{ github.event_name == 'workflow_dispatch' && inputs.trade_date || '' }}"
          if [[ "$MODE" == "live" ]]; then
            missing=()
            [[ -z "${MASSIVE_API_KEY:-}" ]] && missing+=(MASSIVE_API_KEY)
            [[ -z "${ALPACA_API_KEY_ID:-}" ]] && missing+=(ALPACA_API_KEY_ID)
            [[ -z "${ALPACA_API_SECRET_KEY:-}" ]] && missing+=(ALPACA_API_SECRET_KEY)
            [[ -z "${SEC_USER_AGENT:-}" ]] && missing+=(SEC_USER_AGENT)
            [[ -z "${OLLAMA_API_KEY:-}" ]] && missing+=(OLLAMA_API_KEY)
            if (( ${#missing[@]} > 0 )); then
              echo "::error::Missing live-mode Repository secrets: ${missing[*]}"
              exit 1
            fi
          fi
          DATE_ARG=()
          if [[ -n "$TRADE_DATE" ]]; then DATE_ARG=(--date "$TRADE_DATE"); fi
          set +e
          python -m russell2000_market_report.main --mode "$MODE" --top-n "$TOP_N" --output russell2000_market_report/site --data-output russell2000_market_report/output "${DATE_ARG[@]}" 2>&1 | tee /tmp/russell2000-report.log
          REPORT_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$REPORT_STATUS" -ne 0 ]]; then
            python - <<'PY'
          import os
          from pathlib import Path
          text = Path("/tmp/russell2000-report.log").read_text(encoding="utf-8", errors="replace")
          for name in ("MASSIVE_API_KEY", "ALPACA_API_KEY_ID", "ALPACA_API_SECRET_KEY", "SEC_USER_AGENT", "OLLAMA_API_KEY", "OLLAMA_API_KEY_FALLBACK"):
              secret = os.getenv(name, "")
              if secret:
                  text = text.replace(secret, "***")
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          message = " | ".join(lines[-10:])[-3800:] or "Unknown Russell 2000 report error"
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Russell 2000 report failed::{message}")
          PY
            exit "$REPORT_STATUS"
          fi
          python scripts/validate_output.py russell2000_market_report/site --expected-min "$TOP_N" --expected-mode "$MODE"
          python russell2000_market_report/scripts/validate_output.py russell2000_market_report/site --expected-mode "$MODE" --expected-top-n "$TOP_N"
      - name: Render Russell 2000 Drive preview PDF
        run: python scripts/render_market_report_pdf.py --site russell2000_market_report/site --output russell2000_market_report/.drive-upload/market-close-summary.pdf
      - name: Upload Russell 2000 artifact
        uses: actions/upload-artifact@v4
        with:
          name: russell2000-market-report-${{ github.run_id }}
          path: |
            russell2000_market_report/site
            russell2000_market_report/output
            russell2000_market_report/.drive-upload/market-close-summary.pdf
          retention-days: 90
      - name: Prepare Russell 2000 Pages directory
        run: |
          mkdir -p publish-russell2000/site
          cp -a russell2000_market_report/site/. publish-russell2000/site/
          touch publish-russell2000/.nojekyll publish-russell2000/site/.nojekyll
          cat > publish-russell2000/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=site/index.html"><title>罗素 2000 收盘日报</title><script>location.replace('site/index.html');</script></head><body><p>正在打开<a href="site/index.html">罗素 2000 收盘日报</a>…</p></body></html>
          HTML
      - name: Publish Russell 2000 Pages subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish-russell2000
          destination_dir: russell2000
          keep_files: true
          force_orphan: false
          enable_jekyll: false
      - name: Upload Russell 2000 PDF and archive to Google Drive
        env:
          DRIVE_GATEWAY_TOKEN: ${{ secrets.AGENT_UPLOAD_TOKEN || secrets.DRIVE_GATEWAY_TOKEN }}
          DRIVE_MARKET_REPORT_OPERATION: ${{ vars.RUSSELL2000_DRIVE_OPERATION || vars.DRIVE_MARKET_REPORT_OPERATION || 'us_stock_news_file' }}
        shell: bash
        run: |
          if [[ -z "${DRIVE_GATEWAY_TOKEN:-}" ]]; then
            echo "::error::Missing AGENT_UPLOAD_TOKEN or DRIVE_GATEWAY_TOKEN"
            exit 1
          fi
          python scripts/upload_market_report_drive.py \
            --site russell2000_market_report/site \
            --data-output russell2000_market_report/output \
            --archive-output russell2000_market_report/.drive-upload \
            --pdf russell2000_market_report/.drive-upload/market-close-summary.pdf \
            --file-prefix russell2000-market-close
