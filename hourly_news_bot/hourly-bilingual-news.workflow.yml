name: Hourly bilingual US stock news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-bilingual-news
  cancel-in-progress: false

jobs:
  collect-translate-upload:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HOURLY_NEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hourly_news_bot
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
      MAX_ITEMS_PER_SOURCE: ${{ vars.MAX_ITEMS_PER_SOURCE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hourly_news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$OLLAMA_API_KEY" || { echo "Missing OLLAMA_API_KEY"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo "Missing GOOGLE_DRIVE_FOLDER_ID"; exit 1; }

      - name: Collect, translate and upload
        run: python -m src.main

      - name: Keep a short-lived run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-news-${{ github.run_id }}
          path: hourly_news_bot/output/
          if-no-files-found: ignore
          retention-days: 7
